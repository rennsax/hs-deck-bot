[project]
name = "hs-deck-bot"
version = "0.1.0"
description = "hs-deck-bot"
readme = "README.md"
requires-python = ">=3.10, <4.0"
dependencies = [
    "nonebot2[httpx,websockets]>=2.5.0",
    "nonebot-adapter-qq>=1.7.3",
    "manacost-deckstrings>=1.0.0",
    "platformdirs>=4.3.0",
    "sqlalchemy[asyncio]>=2.0.57",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "python-dotenv>=1.2.4",
    "rapidfuzz>=3.14.5",
]

[project.scripts]
hs-deck-bot = "hs_deck_bot.__main__:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["hs_deck", "hs_deck_bot"]

[project.optional-dependencies]
dev = [
    
]

[tool.nonebot]
plugin_dirs = ["src/hs_deck_bot/plugins"]
builtin_plugins = []

[tool.nonebot.adapters]
nonebot-adapter-qq = [
    { name = "QQ", module_name = "nonebot.adapters.qq" }
]
"@local" = []

[tool.nonebot.plugins]
"@local" = []

